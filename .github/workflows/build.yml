name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: FileOrganiser-Windows
            file: dist/FileOrganiser.exe
          - os: macos-latest
            artifact: FileOrganiser-macOS
            file: dist/FileOrganiser
          - os: ubuntu-latest
            artifact: FileOrganiser-Linux
            file: dist/FileOrganiser
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build application
        run: python build.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}

      - name: Attach build to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
          generate_release_notes: true
