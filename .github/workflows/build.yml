name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: FileOrganiser-Windows
            file: dist/FileOrganiser-Windows.exe
          - os: macos-latest
            artifact: FileOrganiser-macOS
            file: dist/FileOrganiser-macOS
          - os: ubuntu-latest
            artifact: FileOrganiser-Linux
            file: dist/FileOrganiser-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python -m pip install --upgrade pyinstaller
      - name: Build application
        run: python build.py
      - name: Give build a platform-specific name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/FileOrganiser.exe dist/FileOrganiser-Windows.exe
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            mv dist/FileOrganiser dist/FileOrganiser-macOS
          else
            mv dist/FileOrganiser dist/FileOrganiser-Linux
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built applications
        uses: actions/download-artifact@v4
        with:
          pattern: FileOrganiser-*
          merge-multiple: true
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
